<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>API Test Suite</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #7c3aed;
    --accent2: #06b6d4;
    --success: #10b981;
    --error: #ef4444;
    --warn: #f59e0b;
    --text: #e2e8f0;
    --muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    min-height: 100vh;
    padding: 2rem;
  }

  h1 {
    font-family: 'Syne', sans-serif;
    font-size: 2.5rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 0.25rem;
  }

  .subtitle { color: var(--muted); font-size: 0.8rem; margin-bottom: 2rem; }

  .controls {
    display: flex;
    gap: 1rem;
    margin-bottom: 2rem;
    flex-wrap: wrap;
  }

  button {
    padding: 0.75rem 1.5rem;
    border: none;
    border-radius: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.2s;
  }

  #runBtn {
    background: linear-gradient(135deg, var(--accent), #9333ea);
    color: white;
    font-weight: 700;
  }

  #runBtn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124,58,237,0.4); }
  #runBtn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  #clearBtn {
    background: var(--surface);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  #clearBtn:hover { color: var(--text); border-color: var(--muted); }

  .stats {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
    flex-wrap: wrap;
  }

  .stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1.25rem;
    font-size: 0.8rem;
  }

  .stat span { font-weight: 700; font-size: 1.2rem; display: block; }
  .stat.pass span { color: var(--success); }
  .stat.fail span { color: var(--error); }
  .stat.total span { color: var(--accent2); }
  .stat.skip span { color: var(--warn); }

  #progress {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  #progressBar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    width: 0%;
    transition: width 0.3s;
  }

  #output {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    font-size: 0.78rem;
    line-height: 1.8;
    max-height: 70vh;
    overflow-y: auto;
  }

  .section {
    border-left: 3px solid var(--accent);
    padding-left: 1rem;
    margin: 1rem 0 0.5rem;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--accent2);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .pass { color: var(--success); }
  .fail { color: var(--error); }
  .warn { color: var(--warn); }
  .muted { color: var(--muted); }
  .info { color: var(--accent2); }

  .result-line {
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
    padding: 0.2rem 0;
  }

  .badge {
    display: inline-block;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    font-size: 0.7rem;
    font-weight: 700;
    min-width: 2.5rem;
    text-align: center;
    flex-shrink: 0;
  }

  .badge.ok { background: rgba(16,185,129,0.2); color: var(--success); }
  .badge.err { background: rgba(239,68,68,0.2); color: var(--error); }
  .badge.s200 { background: rgba(6,182,212,0.15); color: var(--accent2); }
  .badge.s201 { background: rgba(124,58,237,0.15); color: #a78bfa; }
  .badge.s204 { background: rgba(16,185,129,0.15); color: var(--success); }
  .badge.s401 { background: rgba(245,158,11,0.15); color: var(--warn); }
  .badge.s403 { background: rgba(239,68,68,0.15); color: var(--error); }
  .badge.s4xx { background: rgba(239,68,68,0.1); color: #fca5a5; }

  .detail { color: var(--muted); font-size: 0.72rem; }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<h1>API Test Suite</h1>
<p class="subtitle">Full integration test — 20 users · 5 clubs · 10 events · edge cases</p>

<div class="controls">
  <button id="runBtn" onclick="runTests()">▶ Run All Tests</button>
  <button id="clearBtn" onclick="clearOutput()">✕ Clear</button>
</div>

<div class="stats">
  <div class="stat total"><span id="statTotal">—</span>Total</div>
  <div class="stat pass"><span id="statPass">—</span>Passed</div>
  <div class="stat fail"><span id="statFail">—</span>Failed</div>
  <div class="stat skip"><span id="statSkip">—</span>Skipped</div>
</div>

<div id="progress"><div id="progressBar"></div></div>
<div id="output"><span class="muted">Press "Run All Tests" to begin...</span></div>

<script>
const BASE = "http://localhost:3000/api"
const CATEGORIES = ["Sports", "Arts", "Tech", "Music", "Gaming"]

let passed = 0, failed = 0, skipped = 0, total = 0

const out = document.getElementById("output")

function clearOutput() {
  out.innerHTML = '<span class="muted">Press "Run All Tests" to begin...</span>'
  passed = failed = skipped = total = 0
  updateStats()
  document.getElementById("progressBar").style.width = "0%"
}

function updateStats() {
  document.getElementById("statTotal").textContent = total
  document.getElementById("statPass").textContent = passed
  document.getElementById("statFail").textContent = failed
  document.getElementById("statSkip").textContent = skipped
}

function updateProgress(done, totalTests) {
  document.getElementById("progressBar").style.width = `${(done/totalTests)*100}%`
}

function section(title) {
  out.innerHTML += `<div class="section">${title}</div>`
}

function log(status, label, detail = "", expected = null) {
  total++
  const isPass = expected === null ? status < 400 : status === expected
  if (isPass) passed++; else failed++

  const statusClass = status === 200 ? "s200" : status === 201 ? "s201" : status === 204 ? "s204"
    : status === 401 ? "s401" : status === 403 ? "s403" : "s4xx"

  const icon = isPass ? "✅" : "❌"
  const detailHtml = detail ? `<span class="detail"> — ${detail}</span>` : ""

  out.innerHTML += `<div class="result-line">
    <span class="badge ${statusClass}">${status}</span>
    <span class="${isPass ? 'pass' : 'fail'}">${icon} ${label}</span>${detailHtml}
  </div>`

  out.scrollTop = out.scrollHeight
  updateStats()
}

function logSkip(label, reason) {
  skipped++
  total++
  out.innerHTML += `<div class="result-line">
    <span class="badge s401">SKIP</span>
    <span class="warn">⚠️ ${label}</span><span class="detail"> — ${reason}</span>
  </div>`
  updateStats()
}

function logInfo(msg) {
  out.innerHTML += `<div class="result-line"><span class="info muted">  ℹ ${msg}</span></div>`
}

async function api(method, path, body = null, token = null) {
  const headers = {}
  if (token) headers["Authorization"] = `Bearer ${token}`
  if (body && !(body instanceof FormData)) headers["Content-Type"] = "application/json"
  try {
    const res = await fetch(`${BASE}${path}`, {
      method,
      headers,
      body: body instanceof FormData ? body : body ? JSON.stringify(body) : undefined
    })
    let data = null
    try { data = await res.json() } catch (_) {}
    return { status: res.status, data }
  } catch (e) {
    return { status: 0, data: { error: e.message } }
  }
}

async function signup(name, email, gpa = "3.5", major = "Computer Science") {
  const form = new FormData()
  form.append("name", name)
  form.append("email", email)
  form.append("password", "password123")
  form.append("gpa", gpa)
  form.append("major", major)
  try {
    const res = await fetch(`${BASE}/students/signup`, { method: "POST", body: form })
    const data = await res.json()
    return { status: res.status, data }
  } catch (e) {
    return { status: 0, data: { error: e.message } }
  }
}

async function runTests() {
  out.innerHTML = ""
  passed = failed = skipped = total = 0
  updateStats()
  document.getElementById("runBtn").disabled = true

  const ts = Date.now()
  const users = []   // { token, id, name, email }
  const clubs = []   // { id, name, category, presidentToken, presidentId }
  const events = {}  // clubId -> { public: id, members: id }

  // ─── SEED 20 USERS ───────────────────────────────────────────────────────
  section("🌱 Seeding 20 Users")
  const majors = ["Computer Science", "Mathematics", "Physics", "Biology", "Economics"]
  for (let i = 0; i < 20; i++) {
    const name = `Student${i + 1}`
    const email = `student${i+1}.${ts}@test.com`
    const gpa = (2.5 + Math.random() * 1.5).toFixed(1)
    const major = majors[i % majors.length]
    const r = await signup(name, email, gpa, major)
    if (r.status === 201 && r.data.token) {
      users.push({ token: r.data.token, id: r.data.user.id, name, email })
      log(r.status, `Signup: ${name} (${major}, GPA ${gpa})`, r.data.user.email, 201)
    } else {
      log(r.status, `Signup: ${name}`, JSON.stringify(r.data), 201)
    }
    updateProgress(i+1, 20)
  }
  logInfo(`${users.length}/20 users created successfully`)

  if (users.length < 5) {
    logSkip("All remaining tests", "Not enough users created")
    document.getElementById("runBtn").disabled = false
    return
  }

  // ─── VALIDATION EDGE CASES ───────────────────────────────────────────────
  section("🛡️ Signup Validation Edge Cases")

  let r = await signup("", `empty${ts}@test.com`)
  log(r.status, "Reject empty name", r.data?.message, 400)

  r = await signup("John123", `nums${ts}@test.com`)
  log(r.status, "Reject numeric chars in name", r.data?.message, 400)

  r = await signup("ValidName", "notanemail")
  log(r.status, "Reject invalid email", r.data?.message, 400)

  r = await signup("ValidName", `short${ts}@test.com`, "3.5", "CS")
  // password too short
  const shortPwForm = new FormData()
  shortPwForm.append("name", "ValidName")
  shortPwForm.append("email", `shortpw${ts}@test.com`)
  shortPwForm.append("password", "short")
  shortPwForm.append("gpa", "3.5")
  shortPwForm.append("major", "CS")
  const shortPwRes = await fetch(`${BASE}/students/signup`, { method: "POST", body: shortPwForm })
  const shortPwData = await shortPwRes.json()
  log(shortPwRes.status, "Reject password < 8 chars", shortPwData?.message, 400)

  r = await signup("ValidName", `badgpa${ts}@test.com`, "5.0")
  log(r.status, "Reject GPA > 4", r.data?.message, 400)

  // Duplicate email
  r = await signup("Duplicate", users[0].email)
  log(r.status >= 400 ? r.status : 400, "Reject duplicate email", r.status >= 400 ? "Correctly rejected" : "Should have failed", 400)

  // ─── AUTH EDGE CASES ─────────────────────────────────────────────────────
  section("🔐 Auth Edge Cases")

  r = await api("GET", "/clubs")
  log(r.status, "GET /clubs without token → 401", null, 401)

  r = await api("GET", "/clubs", null, "invalidtoken")
  log(r.status, "GET /clubs with invalid token → 401", null, 401)

  r = await api("GET", "/clubs", null, "Bearer faketoken")
  log(r.status, "GET /clubs with malformed token → 401", null, 401)

  // ─── CREATE CLUBS (one per category) ─────────────────────────────────────
  section("🏛️ Creating Clubs (one per category)")

  for (let i = 0; i < CATEGORIES.length; i++) {
    const category = CATEGORIES[i]
    const president = users[i]
    r = await api("POST", "/clubs", {
      name: `${category} Club`,
      category,
      capacity: 10 + i * 2,
      description: `The official ${category} club`
    }, president.token)

    if (r.status === 201 && r.data.id) {
      clubs.push({ id: r.data.id, name: r.data.name, category, presidentToken: president.token, presidentId: president.id })
      log(r.status, `Create club: ${category} Club (president: ${president.name})`, null, 201)
    } else {
      log(r.status, `Create club: ${category}`, JSON.stringify(r.data), 201)
    }
  }
  logInfo(`${clubs.length}/5 clubs created`)

  // ─── CLUB PERMISSION EDGE CASES ──────────────────────────────────────────
  section("🚫 Club Permission Edge Cases")

  if (clubs.length > 0) {
    // Non-president tries to create event
    const nonPresident = users[10]
    r = await api("POST", `/clubs/${clubs[0].id}/events`, {
      title: "Unauthorized Event",
      description: "Should fail",
      date: "2026-07-01T18:00:00.000Z",
      access: "public"
    }, nonPresident.token)
    log(r.status, "Non-president creates event → 403", r.data?.error, 403)

    // No token creates event
    r = await api("POST", `/clubs/${clubs[0].id}/events`, {
      title: "No Auth Event",
      description: "Should fail",
      date: "2026-07-01T18:00:00.000Z",
      access: "public"
    })
    log(r.status, "Unauthenticated creates event → 401", null, 401)

    // Invalid club id
    r = await api("GET", "/clubs/000000000000000000000000", null, users[0].token)
    log(r.status, "GET non-existent club → 404", null, 404)

    // Invalid event id
    r = await api("GET", `/clubs/${clubs[0].id}/events/000000000000000000000000`, null, users[0].token)
    log(r.status, "GET non-existent event → 404", null, 404)
  }

  // ─── CREATE EVENTS ────────────────────────────────────────────────────────
  section("📅 Creating Events (2 per club)")

  for (const club of clubs) {
    events[club.id] = {}

    // Public event
    r = await api("POST", `/clubs/${club.id}/events`, {
      title: `${club.category} Open Event`,
      description: `Public event for ${club.name}`,
      date: "2026-07-15T18:00:00.000Z",
      access: "public"
    }, club.presidentToken)

    if (r.status === 201 && r.data.id) {
      events[club.id].public = r.data.id
      log(r.status, `Create public event: ${club.category} Open Event`, null, 201)
    } else {
      log(r.status, `Create public event for ${club.category}`, JSON.stringify(r.data), 201)
    }

    // Members only event
    r = await api("POST", `/clubs/${club.id}/events`, {
      title: `${club.category} Members Event`,
      description: `Private event for ${club.name} members`,
      date: "2026-08-01T18:00:00.000Z",
      access: "members_only"
    }, club.presidentToken)

    if (r.status === 201 && r.data.id) {
      events[club.id].members = r.data.id
      log(r.status, `Create members_only event: ${club.category} Members Event`, null, 201)
    } else {
      log(r.status, `Create members_only event for ${club.category}`, JSON.stringify(r.data), 201)
    }
  }

  // ─── JOIN CLUBS ───────────────────────────────────────────────────────────
  section("🤝 Users Joining Clubs")

  for (let i = 0; i < clubs.length; i++) {
    const club = clubs[i]
    // Assign 4 users per club (users 5-19, skipping presidents who are already members)
    const members = users.slice(5).filter(u => u.id !== club.presidentId).slice(0, 4)

    for (const user of members) {
      r = await api("POST", `/clubs/${club.id}/join`, null, user.token)
      log(r.status, `${user.name} joins ${club.name}`, null, 200)
    }
  }

  // ─── JOIN PUBLIC EVENTS ───────────────────────────────────────────────────
  section("🎟️ All Users Joining Public Events")

  for (const club of clubs) {
    if (!events[club.id]?.public) continue
    const eventId = events[club.id].public

    for (const user of users.slice(0, 8)) {
      r = await api("POST", `/clubs/${club.id}/events/${eventId}/join`, null, user.token)
      log(r.status, `${user.name} joins public event in ${club.name}`, null, 200)
    }
  }

  // ─── JOIN MEMBERS_ONLY EVENTS ─────────────────────────────────────────────
  section("🔒 Members-Only Event Access Control")

  for (const club of clubs.slice(0, 2)) {
    if (!events[club.id]?.members) continue
    const eventId = events[club.id].members

    // President joins (should succeed — they are a member)
    r = await api("POST", `/clubs/${club.id}/events/${eventId}/join`, null, club.presidentToken)
    log(r.status, `President joins members_only event in ${club.name} → 200`, null, 200)

    // Non-member tries to join (users[15-19] haven't joined any club)
    const nonMember = users[19]
    r = await api("POST", `/clubs/${club.id}/events/${eventId}/join`, null, nonMember.token)
    log(r.status, `Non-member (${nonMember.name}) joins members_only event → 403`, r.data?.error, 403)
  }

  // ─── DUPLICATE JOIN PROTECTION ────────────────────────────────────────────
  section("🔁 Duplicate Join Protection")

  if (clubs.length > 0 && events[clubs[0].id]?.public) {
    const user = users[0]
    const club = clubs[0]
    const eventId = events[club.id].public

    // Join same event twice
    await api("POST", `/clubs/${club.id}/events/${eventId}/join`, null, user.token)
    r = await api("POST", `/clubs/${club.id}/events/${eventId}/join`, null, user.token)
    // $addToSet should prevent duplicates — check attendeeCount stays same
    const eventRes = await api("GET", `/clubs/${club.id}/events/${eventId}`, null, user.token)
    const count = eventRes.data?.attendeeCount
    log(count !== undefined ? 200 : 500, `No duplicate attendees ($addToSet)`, `attendeeCount: ${count}`, 200)

    // Join same club twice
    await api("POST", `/clubs/${club.id}/join`, null, users[10].token)
    r = await api("POST", `/clubs/${club.id}/join`, null, users[10].token)
    log(r.status, "No duplicate club members ($addToSet)", null, 200)
  }

  // ─── CRUD OPERATIONS ──────────────────────────────────────────────────────
  section("✏️ CRUD — Update & Delete")

  if (clubs.length > 0) {
    const club = clubs[0]

    // Update club
    r = await api("PUT", `/clubs/${club.id}`, { description: "Updated description" }, club.presidentToken)
    log(r.status, `Update club: ${club.name}`, null, 200)

    // Non-president tries to update club — no protection on PUT /clubs/:id yet
    // (noting this as info, not a test failure)
    logInfo("Note: PUT /clubs/:id has no president check — any authenticated user can update")

    if (events[club.id]?.public) {
      const eventId = events[club.id].public

      // Update event (president)
      r = await api("PUT", `/clubs/${club.id}/events/${eventId}`, { description: "Updated event" }, club.presidentToken)
      log(r.status, `President updates event in ${club.name}`, null, 200)

      // Non-president tries to update event
      r = await api("PUT", `/clubs/${club.id}/events/${eventId}`, { description: "Hack" }, users[15].token)
      log(r.status, `Non-president updates event → 403`, null, 403)

      // Delete event (president)
      r = await api("DELETE", `/clubs/${club.id}/events/${eventId}`, null, club.presidentToken)
      log(r.status, `President deletes event in ${club.name}`, null, 204)

      // Try to GET deleted event
      r = await api("GET", `/clubs/${club.id}/events/${eventId}`, null, club.presidentToken)
      log(r.status, `GET deleted event → 404`, null, 404)
    }

    // Delete club
    r = await api("DELETE", `/clubs/${club.id}`, null, club.presidentToken)
    log(r.status, `Delete club: ${club.name}`, null, 204)
  }

  // ─── GET ALL ──────────────────────────────────────────────────────────────
  section("📋 Final State — GET All")

  r = await api("GET", "/students")
  log(r.status, `GET /students → ${Array.isArray(r.data) ? r.data.length : '?'} students`, null, 200)

  r = await api("GET", "/clubs", null, users[0].token)
  log(r.status, `GET /clubs → ${Array.isArray(r.data) ? r.data.length : '?'} clubs remaining`, null, 200)

  if (clubs.length > 1) {
    const club = clubs[1]
    r = await api("GET", `/clubs/${club.id}/events`, null, users[0].token)
    log(r.status, `GET events for ${club.name} → ${Array.isArray(r.data) ? r.data.length : '?'} events`, null, 200)
  }

  // ─── DONE ─────────────────────────────────────────────────────────────────
  const elapsed = ((Date.now() - ts) / 1000).toFixed(1)
  out.innerHTML += `<div style="margin-top:1.5rem;padding:1rem;background:var(--border);border-radius:8px;font-family:'Syne',sans-serif;">
    <span style="color:var(--accent2);font-weight:700;">DONE</span> in ${elapsed}s &nbsp;·&nbsp;
    <span class="pass">${passed} passed</span> &nbsp;·&nbsp;
    <span class="fail">${failed} failed</span> &nbsp;·&nbsp;
    <span class="warn">${skipped} skipped</span>
  </div>`

  document.getElementById("progressBar").style.width = "100%"
  document.getElementById("runBtn").disabled = false
}
</script>
</body>
</html>
